<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ma Cagnotte</title>

<!-- PWA iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ma Cagnotte">
<meta name="theme-color" content="#F6F1E7">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">

<style>
/* Polices auto-hébergées — sous-ensemble latin, aucune requête externe */
@font-face {
  font-family: 'Fraunces';
  src: url('fonts/fraunces-var.woff2') format('woff2-variations');
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Atkinson Hyperlegible';
  src: url('fonts/atkinson-400.woff2') format('woff2');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Atkinson Hyperlegible';
  src: url('fonts/atkinson-700.woff2') format('woff2');
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'DM Mono';
  src: url('fonts/dmmono-400.woff2') format('woff2');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'DM Mono';
  src: url('fonts/dmmono-500.woff2') format('woff2');
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}

:root {
  --paper: #F6F1E7;
  --card: #FFFDF8;
  --ink: #2B2620;
  --ink-soft: #6E6558;
  --line: #E5DCC9;
  --credit: #3D6B4F;
  --credit-bg: #E9F0E9;
  --debit: #A2543B;
  --debit-bg: #F5E7E0;
  --gold: #F0E3C4;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { overflow-x: hidden; max-width: 100%; }

body {
  font-family: 'Atkinson Hyperlegible', sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  padding: max(20px, env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom));
}

.wrap { max-width: 560px; margin: 0 auto; }

/* ---------- En-tête ---------- */
header { text-align: center; margin-bottom: 8px; position: relative; }

.eyebrow {
  font-family: 'DM Mono', monospace;
  font-size: 0.75em;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--ink-soft);
}

#btnSettings {
  position: absolute;
  right: 0;
  top: 0;
  background: none;
  border: none;
  font-size: 1.3em;
  cursor: pointer;
  color: var(--ink-soft);
  padding: 4px;
}

.solde {
  font-family: 'Fraunces', serif;
  font-weight: 700;
  font-size: 3.4em;
  line-height: 1.1;
  margin-top: 10px;
  font-variant-numeric: tabular-nums;
}

.solde.negatif { color: var(--debit); }

.tagline {
  color: var(--ink-soft);
  font-size: 0.95em;
  margin-top: 2px;
  margin-bottom: 18px;
  font-style: italic;
}

/* ---------- Bandeau compte à rebours ---------- */
.compteur {
  background: var(--gold);
  border: 1px solid #DCCB9E;
  border-radius: 12px;
  padding: 12px 16px;
  text-align: center;
  font-size: 0.95em;
  margin-bottom: 18px;
  display: none;
}
.compteur strong { font-family: 'Fraunces', serif; font-size: 1.15em; }

/* ---------- Récap mensuel ---------- */
.recap {
  display: flex;
  justify-content: center;
  gap: 10px;
  font-family: 'DM Mono', monospace;
  font-size: 0.85em;
  color: var(--ink-soft);
  margin-bottom: 22px;
  flex-wrap: wrap;
}
.recap .plus { color: var(--credit); }
.recap .moins { color: var(--debit); }

/* ---------- Boutons d'action ---------- */
.actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 18px;
}

.actions button {
  font-family: 'Atkinson Hyperlegible', sans-serif;
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 14px 6px 12px;
  cursor: pointer;
  font-size: 0.85em;
  color: var(--ink);
  line-height: 1.3;
  transition: border-color 0.15s, background 0.15s;
}

.actions button .ico { display: block; font-size: 1.6em; margin-bottom: 4px; }

.actions button.actif {
  border-color: var(--ink);
  background: #FBF6EC;
}

/* ---------- Formulaire ---------- */
#form {
  display: none;
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 24px;
}

#form h2 {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 1.15em;
  margin-bottom: 14px;
}

.champ { margin-bottom: 12px; }

.champ label {
  display: block;
  font-size: 0.85em;
  color: var(--ink-soft);
  margin-bottom: 4px;
}

.champ input {
  width: 100%;
  padding: 12px;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  background: #fff;
  font-size: 1em;
  color: var(--ink);
  font-family: 'Atkinson Hyperlegible', sans-serif;
}

.champ input[inputmode="decimal"] { font-family: 'DM Mono', monospace; }

.champ input:focus { outline: none; border-color: var(--ink); }

.eco-calc {
  font-family: 'DM Mono', monospace;
  font-size: 0.9em;
  color: var(--credit);
  min-height: 1.3em;
  margin-bottom: 10px;
}

.form-btns { display: flex; gap: 10px; }

.form-btns button {
  flex: 1;
  padding: 13px;
  border-radius: 10px;
  border: none;
  font-size: 1em;
  font-weight: 700;
  cursor: pointer;
  font-family: 'Atkinson Hyperlegible', sans-serif;
}

#btnValider { background: var(--ink); color: var(--paper); }
#btnAnnuler { background: none; border: 1.5px solid var(--line); color: var(--ink-soft); }

/* ---------- Historique ---------- */
.histo-titre {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 1.1em;
  margin-bottom: 10px;
}

.vide {
  text-align: center;
  color: var(--ink-soft);
  padding: 30px 10px;
  font-style: italic;
}

.entree {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 8px;
}

.entree .ico { font-size: 1.3em; }

.entree .infos { flex: 1; min-width: 0; }

.entree .desc {
  font-size: 0.95em;
  overflow-wrap: break-word;
}

.entree .date {
  font-family: 'DM Mono', monospace;
  font-size: 0.75em;
  color: var(--ink-soft);
}

.entree .montant {
  font-family: 'DM Mono', monospace;
  font-weight: 500;
  white-space: nowrap;
}

.entree .montant.plus { color: var(--credit); }
.entree .montant.moins { color: var(--debit); }

.entree .suppr {
  background: none;
  border: none;
  color: var(--ink-soft);
  font-size: 1.1em;
  cursor: pointer;
  padding: 4px;
}

/* ---------- Réglages ---------- */
#panneauReglages {
  display: none;
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 24px;
}

#panneauReglages h2 {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 1.15em;
  margin-bottom: 14px;
}

.reglage-btns { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }

.reglage-btns button {
  padding: 11px;
  border-radius: 10px;
  border: 1.5px solid var(--line);
  background: #fff;
  font-size: 0.95em;
  cursor: pointer;
  color: var(--ink);
  font-family: 'Atkinson Hyperlegible', sans-serif;
}

.reglage-btns button.danger { color: var(--debit); border-color: var(--debit-bg); }

footer {
  text-align: center;
  margin-top: 30px;
  font-family: 'DM Mono', monospace;
  font-size: 0.7em;
  color: var(--ink-soft);
  letter-spacing: 0.1em;
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Ma Cagnotte</div>
    <button id="btnSettings" title="Réglages" aria-label="Réglages">⚙︎</button>
    <div class="solde" id="solde">0,00&nbsp;€</div>
    <div class="tagline">à dépenser sans complexe</div>
  </header>

  <div class="compteur" id="compteur"></div>

  <div class="recap" id="recap"></div>

  <div class="actions">
    <button id="btnCourses" onclick="ouvrirForm('courses')">
      <span class="ico">🛒</span>Économie<br>courses
    </button>
    <button id="btnAnticipe" onclick="ouvrirForm('anticipe')">
      <span class="ico">🏷️</span>Achat<br>anticipé
    </button>
    <button id="btnSauvage" onclick="ouvrirForm('sauvage')">
      <span class="ico">🎁</span>Achat<br>sauvage
    </button>
  </div>

  <div id="form">
    <h2 id="formTitre"></h2>
    <div class="champ" id="champDesc">
      <label for="inDesc">Description</label>
      <input type="text" id="inDesc" placeholder="ex : t-shirt, soldes −50 %">
    </div>
    <div class="champ" id="champPlein">
      <label for="inPlein">Prix plein (€)</label>
      <input type="text" inputmode="decimal" id="inPlein" placeholder="0,00">
    </div>
    <div class="champ" id="champMontant">
      <label for="inMontant" id="labelMontant">Montant (€)</label>
      <input type="text" inputmode="decimal" id="inMontant" placeholder="0,00">
    </div>
    <div class="eco-calc" id="ecoCalc"></div>
    <div class="form-btns">
      <button id="btnAnnuler" onclick="fermerForm()">Annuler</button>
      <button id="btnValider" onclick="valider()">Ajouter</button>
    </div>
  </div>

  <div id="panneauReglages">
    <h2>Réglages</h2>
    <div class="champ">
      <label for="inJourJ">Jour J — on commence à compter le :</label>
      <input type="date" id="inJourJ">
    </div>
    <div class="reglage-btns">
      <button onclick="exporterJSON()">📤 Exporter les données (JSON)</button>
      <button onclick="document.getElementById('inImport').click()">📥 Importer des données</button>
      <input type="file" id="inImport" accept=".json,application/json" style="display:none">
      <button class="danger" onclick="toutEffacer()">🗑️ Tout effacer</button>
    </div>
  </div>

  <div class="histo-titre">Historique</div>
  <div id="histo"></div>

  <footer>MA CAGNOTTE · v1.0</footer>

</div>

<script>
'use strict';

const CLE_ENTREES = 'macagnotte_entrees';
const CLE_CONFIG  = 'macagnotte_config';

const TYPES = {
  courses:  { ico: '🛒', titre: 'Économie courses',  sens: +1 },
  anticipe: { ico: '🏷️', titre: 'Achat anticipé',    sens: +1 },
  sauvage:  { ico: '🎁', titre: 'Achat sauvage',     sens: -1 }
};

let entrees = [];
let config = { jourJ: null };
let typeCourant = null;

const fmt = new Intl.NumberFormat('fr-BE', { style: 'currency', currency: 'EUR' });
const fmtDate = new Intl.DateTimeFormat('fr-BE', { day: '2-digit', month: '2-digit', year: 'numeric' });

/* ---------- Persistance ---------- */
function charger() {
  try { entrees = JSON.parse(localStorage.getItem(CLE_ENTREES)) || []; } catch { entrees = []; }
  try { config = Object.assign({ jourJ: null }, JSON.parse(localStorage.getItem(CLE_CONFIG)) || {}); } catch {}
}

function sauver() {
  localStorage.setItem(CLE_ENTREES, JSON.stringify(entrees));
  localStorage.setItem(CLE_CONFIG, JSON.stringify(config));
}

/* ---------- Utilitaires ---------- */
function lireMontant(id) {
  const brut = document.getElementById(id).value.replace(',', '.').trim();
  const val = parseFloat(brut);
  return isNaN(val) ? null : Math.round(val * 100) / 100;
}

function echapper(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

/* ---------- Affichage ---------- */
function rafraichir() {
  // Solde
  let solde = 0;
  const maintenant = new Date();
  const moisCourant = maintenant.getFullYear() + '-' + maintenant.getMonth();
  let moisPlus = 0, moisMoins = 0;

  entrees.forEach(e => {
    const m = TYPES[e.type].sens * e.montant;
    solde += m;
    const d = new Date(e.date);
    if ((d.getFullYear() + '-' + d.getMonth()) === moisCourant) {
      if (m >= 0) moisPlus += m; else moisMoins += -m;
    }
  });

  const elSolde = document.getElementById('solde');
  elSolde.textContent = fmt.format(solde);
  elSolde.classList.toggle('negatif', solde < 0);

  // Récap mensuel
  document.getElementById('recap').innerHTML =
    'Ce mois-ci&nbsp;: <span class="plus">+' + fmt.format(moisPlus) + '</span> · ' +
    '<span class="moins">−' + fmt.format(moisMoins) + '</span>';

  // Compte à rebours
  const elCompteur = document.getElementById('compteur');
  if (config.jourJ) {
    const jourJ = new Date(config.jourJ + 'T00:00:00');
    const aujourdhui = new Date();
    aujourdhui.setHours(0, 0, 0, 0);
    const diff = Math.ceil((jourJ - aujourdhui) / 86400000);
    if (diff > 0) {
      elCompteur.style.display = 'block';
      elCompteur.innerHTML = '🎉 Encore <strong>' + diff + '</strong> jour' + (diff > 1 ? 's' : '') +
        ' de liberté totale — on compte à partir du ' + fmtDate.format(jourJ);
    } else {
      elCompteur.style.display = 'none';
    }
  } else {
    elCompteur.style.display = 'none';
  }

  // Historique
  const elHisto = document.getElementById('histo');
  if (!entrees.length) {
    elHisto.innerHTML = '<div class="vide">Aucun mouvement pour l\'instant. Premier ticket de caisse ?</div>';
    return;
  }

  elHisto.innerHTML = entrees.map(e => {
    const t = TYPES[e.type];
    const m = t.sens * e.montant;
    const signe = m >= 0 ? '+' : '−';
    const classe = m >= 0 ? 'plus' : 'moins';
    let desc = e.description ? echapper(e.description) : t.titre;
    if (e.type === 'anticipe' && e.prixPlein != null && e.prixPaye != null) {
      desc += ' <span style="color:var(--ink-soft);font-size:0.85em">(' +
        fmt.format(e.prixPaye) + ' au lieu de ' + fmt.format(e.prixPlein) + ')</span>';
    }
    return '<div class="entree">' +
      '<span class="ico">' + t.ico + '</span>' +
      '<div class="infos"><div class="desc">' + desc + '</div>' +
      '<div class="date">' + fmtDate.format(new Date(e.date)) + '</div></div>' +
      '<span class="montant ' + classe + '">' + signe + fmt.format(Math.abs(m)) + '</span>' +
      '<button class="suppr" onclick="supprimer(' + e.id + ')" aria-label="Supprimer">✕</button>' +
      '</div>';
  }).join('');
}

/* ---------- Formulaire ---------- */
function ouvrirForm(type) {
  typeCourant = type;
  document.getElementById('panneauReglages').style.display = 'none';
  document.querySelectorAll('.actions button').forEach(b => b.classList.remove('actif'));
  document.getElementById('btn' + type.charAt(0).toUpperCase() + type.slice(1)).classList.add('actif');

  const f = document.getElementById('form');
  f.style.display = 'block';
  document.getElementById('formTitre').textContent = TYPES[type].ico + ' ' + TYPES[type].titre;

  document.getElementById('champDesc').style.display  = (type === 'courses') ? 'none' : 'block';
  document.getElementById('champPlein').style.display = (type === 'anticipe') ? 'block' : 'none';
  document.getElementById('ecoCalc').textContent = '';

  const label = document.getElementById('labelMontant');
  if (type === 'courses')  label.textContent = 'Économie du ticket (€)';
  if (type === 'anticipe') label.textContent = 'Prix payé (€)';
  if (type === 'sauvage')  label.textContent = 'Prix payé (€)';

  document.getElementById('inDesc').value = '';
  document.getElementById('inPlein').value = '';
  document.getElementById('inMontant').value = '';
  document.getElementById('inMontant').focus();
  f.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function fermerForm() {
  document.getElementById('form').style.display = 'none';
  document.querySelectorAll('.actions button').forEach(b => b.classList.remove('actif'));
  typeCourant = null;
}

// Calcul en direct de l'économie pour l'achat anticipé
['inPlein', 'inMontant'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    if (typeCourant !== 'anticipe') return;
    const plein = lireMontant('inPlein');
    const paye = lireMontant('inMontant');
    const el = document.getElementById('ecoCalc');
    if (plein != null && paye != null && plein > paye) {
      el.textContent = '→ économie : +' + fmt.format(plein - paye);
    } else {
      el.textContent = '';
    }
  });
});

function valider() {
  const type = typeCourant;
  if (!type) return;

  let montant, prixPlein = null, prixPaye = null;

  if (type === 'anticipe') {
    prixPlein = lireMontant('inPlein');
    prixPaye = lireMontant('inMontant');
    if (prixPlein == null || prixPaye == null) { alert('Indique le prix plein et le prix payé.'); return; }
    if (prixPlein <= prixPaye) { alert('Le prix plein doit être supérieur au prix payé — sinon, où est l\'économie ? 😉'); return; }
    montant = Math.round((prixPlein - prixPaye) * 100) / 100;
  } else {
    montant = lireMontant('inMontant');
    if (montant == null || montant <= 0) { alert('Indique un montant valide.'); return; }
  }

  const description = document.getElementById('inDesc').value.trim();
  if (type !== 'courses' && !description) { alert('Une petite description, pour la postérité.'); return; }

  entrees.unshift({
    id: Date.now(),
    type, montant, description,
    prixPlein, prixPaye,
    date: new Date().toISOString()
  });

  sauver();
  fermerForm();
  rafraichir();
}

function supprimer(id) {
  const e = entrees.find(x => x.id === id);
  if (!e) return;
  const t = TYPES[e.type];
  if (confirm('Supprimer « ' + (e.description || t.titre) + ' » (' + fmt.format(e.montant) + ') ?')) {
    entrees = entrees.filter(x => x.id !== id);
    sauver();
    rafraichir();
  }
}

/* ---------- Réglages ---------- */
document.getElementById('btnSettings').addEventListener('click', () => {
  fermerForm();
  const p = document.getElementById('panneauReglages');
  p.style.display = (p.style.display === 'block') ? 'none' : 'block';
});

document.getElementById('inJourJ').addEventListener('change', function () {
  config.jourJ = this.value || null;
  sauver();
  rafraichir();
});

function exporterJSON() {
  const donnees = { app: 'ma-cagnotte', version: 1, exporte: new Date().toISOString(), config, entrees };
  const blob = new Blob([JSON.stringify(donnees, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ma-cagnotte-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

document.getElementById('inImport').addEventListener('change', function () {
  const fichier = this.files[0];
  if (!fichier) return;
  const lecteur = new FileReader();
  lecteur.onload = () => {
    try {
      const donnees = JSON.parse(lecteur.result);
      if (!Array.isArray(donnees.entrees)) throw new Error('format');
      if (!confirm('Remplacer les données actuelles par celles du fichier (' + donnees.entrees.length + ' mouvements) ?')) return;
      entrees = donnees.entrees;
      config = Object.assign({ jourJ: null }, donnees.config || {});
      sauver();
      document.getElementById('inJourJ').value = config.jourJ || '';
      rafraichir();
    } catch {
      alert('Fichier illisible — ce n\'est pas un export Ma Cagnotte.');
    }
  };
  lecteur.readAsText(fichier);
  this.value = '';
});

function toutEffacer() {
  if (confirm('Tout effacer, vraiment ? Pense à exporter d\'abord.')) {
    if (confirm('Dernière chance : cette action est définitive.')) {
      entrees = [];
      config = { jourJ: null };
      sauver();
      document.getElementById('inJourJ').value = '';
      rafraichir();
    }
  }
}

/* ---------- Démarrage ---------- */
charger();
document.getElementById('inJourJ').value = config.jourJ || '';
rafraichir();
</script>
</body>
</html>
